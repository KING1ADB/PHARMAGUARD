version: '3.8'

services:
  # PostgreSQL 16 Production Database with automated data persistence
  postgres:
    image: postgres:16-alpine
    container_name: pharmaguard_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmaguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmaguard_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pharmaguard_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmaguard_user} -d ${POSTGRES_DB:-pharmaguard_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmaguard_network

  # Redis Cache & Background Task Broker
  redis:
    image: redis:7-alpine
    container_name: pharmaguard_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    volumes:
      - redis_prod_data:/data
    networks:
      - pharmaguard_network

  # PharmaGuard AI Autonomous Agent Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmaguard_api_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharmaguard_user}:${POSTGRES_PASSWORD:-pharmaguard_secure_password_2026}@postgres:5432/${POSTGRES_DB:-pharmaguard_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-pharmaguard_enterprise_prod_secret_key_2026_super_secure}
      ENABLE_SIMULATION_FEATURES: "false"
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@pharmaguard.ai}
    ports:
      - "8000:8000"
    networks:
      - pharmaguard_network

  # Nginx Reverse Proxy with SSL Termination & Rate Limiting
  nginx:
    image: nginx:alpine
    container_name: pharmaguard_nginx_prod
    restart: always
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - pharmaguard_network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  pharmaguard_network:
    driver: bridge
