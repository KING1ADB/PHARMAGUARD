name: PharmaGuard AI — Google Cloud Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'pharmaguard-ai-prod' }}
  REGION: ${{ secrets.GCP_REGION || 'europe-west1' }}
  GAR_REPO: pharmaguard-repo
  SERVICE_NAME: pharmaguard-backend
  IMAGE_NAME: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID || 'pharmaguard-ai-prod' }}/pharmaguard-repo/pharmaguard-backend

jobs:
  # =========================================================================
  # STAGE 1: Automated Testing, Linting & Security Audit
  # =========================================================================
  test_and_audit:
    name: 🧪 Automated Tests & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8 bandit httpx

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r backend/app -x backend/app/tests -ll -ii || true

      - name: Execute Full Pytest Test Suite
        env:
          APP_ENV: test
          ENABLE_SIMULATION_FEATURES: "true"
          DATABASE_URL: sqlite:///test_ci.db
        run: |
          cd backend
          python -m pytest -v --tb=short

  # =========================================================================
  # STAGE 2: Build & Push Container to Google Artifact Registry
  # =========================================================================
  build_and_publish:
    name: 📦 Build & Publish Container Image
    needs: test_and_audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build & Tag Multi-Stage Production Image
        id: build-image
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.IMAGE_NAME }}:latest"
          
          docker build \
            --target runner \
            -t "$IMAGE_TAG" \
            -t "$LATEST_TAG" \
            -f Dockerfile .
            
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # =========================================================================
  # STAGE 3: Zero-Downtime Deployment to Google Cloud Run
  # =========================================================================
  deploy_to_cloud_run:
    name: 🚀 Deploy to Cloud Run & Run Health Verification
    needs: build_and_publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture Previous Active Revision (for Rollback)
        id: prev-rev
        run: |
          PREV_REV=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || echo "")
          echo "previous_revision=$PREV_REV" >> $GITHUB_OUTPUT

      - name: Deploy New Revision to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ needs.build_and_publish.outputs.image_tag }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 20 \
            --cpu 2 \
            --memory 4Gi \
            --concurrency 80 \
            --timeout 300 \
            --set-env-vars APP_ENV=production,LOG_LEVEL=INFO,ENABLE_SIMULATION_FEATURES=false,USE_LOCAL_STORAGE_FALLBACK=false,USE_GCP_SECRET_MANAGER=true \
            --set-secrets "DATABASE_URL=PHARMAGUARD_DATABASE_URL:latest,JWT_SECRET_KEY=PHARMAGUARD_JWT_SECRET:latest,WHATSAPP_ACCESS_TOKEN=PHARMAGUARD_WHATSAPP_TOKEN:latest,SMTP_PASSWORD=PHARMAGUARD_SMTP_PASSWORD:latest"

      - name: Get Service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Run Production Smoke & Readiness Verification
        id: smoke-test
        run: |
          TARGET_URL="${{ steps.get-url.outputs.service_url }}"
          echo "Verifying deployment at: $TARGET_URL"
          
          python scripts/verify_gcp_deployment.py --url "$TARGET_URL" --secret "${{ secrets.CLOUD_SCHEDULER_SECRET }}"

      - name: Automated Rollback on Smoke Test Failure
        if: failure() && steps.prev-rev.outputs.previous_revision != ''
        run: |
          echo "⚠️ Smoke tests failed! Initiating automated rollback to revision: ${{ steps.prev-rev.outputs.previous_revision }}"
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --to-revisions=${{ steps.prev-rev.outputs.previous_revision }}=100
          echo "Rollback completed successfully."
